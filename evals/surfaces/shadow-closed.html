<!doctype html>
<html><head><meta charset="utf-8"><title>Surface: closed shadow</title></head>
<body>
<h1>Closed shadow probe</h1>
<button>Light button</button>
<div id="host-c"></div>
<div id="host-d"></div>
<script>
window.__clicks = [];
const c = document.getElementById('host-c').attachShadow({mode:'closed'});
c.innerHTML = '<button id="cb">Closed action</button><div role="switch" tabindex="0" id="cs">Closed toggle</div><p>Closed shadow text alpha</p>';
c.getElementById('cb').addEventListener('click', () => window.__clicks.push('closed'));
const inner = document.createElement('div');
c.appendChild(inner);
inner.attachShadow({mode:'open'}).innerHTML = '<button id="nb">Nested-in-closed action</button>';
const d = document.getElementById('host-d').attachShadow({mode:'closed'});
d.innerHTML = '<input type="text" aria-label="Closed name">';
</script>
</body></html>

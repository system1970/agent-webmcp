<!doctype html>
<html><head><meta charset="utf-8"><title>Surface: roles</title></head>
<body>
<h1>Roles probe</h1>
<section aria-label="Section A"><h2>Section A</h2><button>Copy</button></section>
<section aria-label="Section B"><h2>Section B</h2><button>Copy</button></section>
<button aria-label="Close dialog"><svg width="10" height="10"><circle cx="5" cy="5" r="4"/></svg></button>
<button><img alt="Save icon"> Save</button>
<div role="switch" aria-checked="true" tabindex="0">Notifications</div>
<input type="range" aria-label="Volume" min="0" max="10" value="5">
<div role="tablist"><div role="tab" aria-selected="true">Overview</div><div role="tab">Details</div></div>
<div role="listbox" aria-label="Choices"><div role="option">Choice One</div><div role="option">Choice Two</div></div>
<div role="combobox" aria-label="Search fruit" tabindex="0">Apple</div>
<div role="spinbutton" aria-label="Quantity" tabindex="0">3</div>
<label for="em">Email</label><input id="em" type="email" placeholder="you@x.test">
<p id="cap">Code caption</p><input type="text" aria-labelledby="cap">
<select aria-label="Country"><option>Latvia</option><option>Lithuania</option></select>
<details><summary>More info</summary><p>Detail text alpha.</p></details>
</body></html>

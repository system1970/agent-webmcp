<!doctype html>
<html><head><meta charset="utf-8"><title>Surface: form</title></head>
<body>
<h1>Form probe</h1>
<form id="login" aria-label="Login form">
<label>Username<input type="text" name="user"></label>
<label>Password<input type="password" name="pass"></label>
<label><input type="checkbox" name="remember"> Remember me</label>
<button type="submit">Sign in</button>
</form>
<div id="done" aria-live="polite"></div>
<script>
document.getElementById('login').addEventListener('submit', (e) => {
  e.preventDefault();
  const u = document.querySelector('input[name=user]').value;
  document.getElementById('done').textContent = 'Signed in as ' + u;
});
</script>
</body></html>

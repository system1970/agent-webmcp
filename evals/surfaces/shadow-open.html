<!doctype html>
<html><head><meta charset="utf-8"><title>Surface: open shadow</title></head>
<body>
<h1>Open shadow probe</h1>
<button>Light button</button>
<div id="host-a"></div>
<div id="host-b"></div>
<script>
const a = document.getElementById('host-a').attachShadow({mode:'open'});
a.innerHTML = '<h2>Shadow head</h2><button>Shadow action</button><div role="switch" tabindex="0">Shadow toggle</div>';
const nested = document.createElement('div');
a.appendChild(nested);
nested.attachShadow({mode:'open'}).innerHTML = '<button>Nested shadow action</button>';
document.getElementById('host-b').attachShadow({mode:'open'}).innerHTML =
  '<label>Shadow name<input type="text" id="sh-in"></label>';
</script>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Surface: dynamic</title></head>
<body>
<h1>Dynamic probe</h1>
<button id="reveal">Show menu</button>
<nav id="drawer" style="display:none" aria-label="Side menu">
<button>Menu item one</button>
<button>Menu item two</button>
</nav>
<button id="adder">Add control</button>
<div id="late"></div>
<script>
document.getElementById('reveal').addEventListener('click', () => {
  document.getElementById('drawer').style.display = 'block';
});
document.getElementById('adder').addEventListener('click', () => {
  setTimeout(() => {
    const b = document.createElement('button');
    b.textContent = 'Late control';
    document.getElementById('late').appendChild(b);
  }, 800);
});
</script>
</body></html>

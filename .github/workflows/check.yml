name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bun run check:gen
      - run: bun run preflight
